name: factory-update

# The update path across the severed template link. A repo created with the
# template button keeps NO connection to squidbay/factory — that severing is
# a feature (your office is private, yours, and can't be reached from here),
# but it means improvements to the template would never reach you. This
# workflow is the bridge, built the only way this factory builds bridges:
# as a pull request you review and merge. It never auto-merges anything.
#
# What it does, monthly or whenever you run it from the Actions tab:
#   1. Fetches the current template (it's public — no token needed).
#   2. Reads .github/template-manifest.txt — YOUR copy of it — and copies
#      only those template-managed paths over your office's copies. It
#      OVERWRITES; it never deletes. A file of yours the template has never
#      heard of is left where it is.
#
# That last sentence is the load-bearing one. An earlier version of this
# step ran `rm -rf` on each managed folder before re-copying it, which is a
# restore, not a sync: every office-only file inside a managed folder was
# deleted for the crime of being unknown upstream. On 2026-08-01 a run of that
# logic committed such a deletion and PUSHED it to branch
# factory-update/proposal. It failed afterwards, at the step that opens the
# PR — so the repo setting everyone believed was protecting us protected
# nothing: the deletion was already on a branch, one click from a merge. The
# push step comes before the PR step. The setting was never the protection.
#
# The copying logic now lives in scripts/factory-sync.sh, and
# scripts/sync-selftest.sh tests that same file — including a negative control
# that runs the old `rm -rf` logic and proves it really did delete.
#   3. If anything changed, opens (or refreshes) ONE pull request with the
#      whole delta, so you see exactly what the template wants to change.
#   4. Notes — without touching them — any drift in files it deliberately
#      does not manage: your workflows, the manifest itself, and whether your
#      manifest still covers scripts/ (the engine step 2 runs). That last one
#      is the quiet one: an unmanaged engine never updates and never complains.
#
# What it can never do: touch your journal, your specs, your roster, your
# denylist, or anything else absent from the manifest; DELETE any file of
# yours; write a "!" protected path; merge; or rewrite its own workflow files
# (the Actions token physically cannot).
#
# One honest mechanic worth knowing: the PRs this workflow opens use the
# default Actions token, and GitHub does not run other workflows (your
# guardrails check included) on PRs opened that way. The content in them
# comes from the public template, which runs its own gates before anything
# lands there — but your own checks showing as absent on an update PR is
# expected, not broken.

on:
  schedule:
    - cron: "0 7 1 * *"   # the 1st of each month, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: factory-update
  cancel-in-progress: true

jobs:
  propose-update:
    # The template must not try to update itself from itself.
    if: github.repository != 'squidbay/factory'
    runs-on: ubuntu-latest
    env:
      TEMPLATE_REPO: https://github.com/squidbay/factory
      UPDATE_BRANCH: factory-update/proposal
    steps:
      - uses: actions/checkout@v5

      - name: The engine this workflow executes must actually be here
        run: |
          set -u
          # This workflow does not copy files itself — it runs scripts/. An
          # office that hand-installed this workflow WITHOUT bringing scripts/
          # over would otherwise discover that three steps later, as a bare
          # "No such file or directory" from a step named "Apply template-
          # managed paths". Fail here instead, first, with the fix in the
          # error, and — this is the point — fail BEFORE anything is copied,
          # committed, or pushed.
          MISSING=""
          for dep in scripts/factory-sync.sh scripts/sync-selftest.sh; do
            [ -f "$dep" ] || MISSING="$MISSING $dep"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::factory-update stopped before touching anything: this office has the update workflow but not the engine it runs. Missing:$MISSING"
            echo ""
            echo "Nothing was copied, committed, or pushed."
            echo ""
            echo "The workflow and its scripts are one subsystem and travel"
            echo "together. Bring scripts/ over from the template in the same"
            echo "pull request that brought this workflow, and add the line"
            echo "  scripts/"
            echo "to .github/template-manifest.txt so future fixes to the"
            echo "engine arrive on their own."
            echo ""
            echo "The order to do it in: guides/SAFE-UPDATE-BOOTSTRAP.md"
            exit 1
          fi
          echo "Sync engine present: scripts/factory-sync.sh, scripts/sync-selftest.sh"

      - name: Check whether the template is newer (both signals, newest wins)
        id: version
        run: |
          set -u
          LOCAL="none"
          if [ -f .github/template-version.txt ]; then
            LOCAL="$(head -n1 .github/template-version.txt | tr -d '[:space:]')"
          fi

          # The template publishes its version in TWO places, and they are
          # updated by two different human acts:
          #   - .github/template-version.txt  (bumped in the PR that lands work)
          #   - the latest GitHub Release tag (cut afterwards, by hand)
          #
          # So they drift, and the drift used to be silent AND one-directional
          # in the dangerous way. The old logic was release-first with the raw
          # file only as a fallback when no release could be read at all — so
          # whenever the Release lagged the file (the normal state between a
          # merge and a release cut), an office sitting on the Release tag was
          # told "up to date" while days of merged template work sat unshipped.
          # Observed live on 2026-07-27: Release 2026-07-23.4, raw file
          # 2026-07-26.
          #
          # Fix: read BOTH, take the NEWER. Neither source can hide the other,
          # in either direction, and no new human discipline is required. The
          # Release stays the human-readable announcement; the raw file stays
          # the machine anchor.
          REL="$(curl -fsSL https://api.github.com/repos/squidbay/factory/releases/latest 2>/dev/null \
            | grep -o '"tag_name"[[:space:]]*:[[:space:]]*"[^"]*"' | head -n1 \
            | sed 's/.*"\([^"]*\)"[[:space:]]*$/\1/')"
          RAW="$(curl -fsSL https://raw.githubusercontent.com/squidbay/factory/main/.github/template-version.txt 2>/dev/null \
            | head -n1 | tr -d '[:space:]')"

          # sort -V, not plain sort: plain lexicographic ordering puts
          # 2026-07-23.10 *before* 2026-07-23.2, which would quietly stop
          # proposing updates after the ninth point release of a day.
          REMOTE="$(printf '%s\n%s\n' "$REL" "$RAW" | grep -v '^$' | sort -V | tail -n1)"

          echo "local=$LOCAL release=${REL:-unreachable} raw-file=${RAW:-unreachable} newest=${REMOTE:-unknown}"
          if [ -n "$REL" ] && [ -n "$RAW" ] && [ "$REL" != "$RAW" ]; then
            echo "::notice::The template's Release tag ($REL) and version file ($RAW) disagree. Using the newer ($REMOTE)."
          fi

          # If neither signal can be read, don't block — fall through to the
          # sync (the diff gate below still prevents a no-op PR).
          if [ -z "$REMOTE" ] || [ "$LOCAL" != "$REMOTE" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already on the template's latest ($LOCAL). Nothing to propose."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the current template
        if: steps.version.outputs.proceed == 'true'
        run: |
          git clone --depth 1 "$TEMPLATE_REPO" "$RUNNER_TEMP/template"
          echo "Template at: $(git -C "$RUNNER_TEMP/template" rev-parse --short HEAD)"

      - name: Prove the sync engine is still non-destructive (with its negative control)
        if: steps.version.outputs.proceed == 'true'
        run: bash scripts/sync-selftest.sh

      - name: Apply template-managed paths from the manifest
        id: apply
        if: steps.version.outputs.proceed == 'true'
        run: |
          set -u
          MANIFEST=".github/template-manifest.txt"
          if [ ! -f "$MANIFEST" ]; then
            echo "No $MANIFEST in this office — nothing is template-managed. Done."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Overwrite-only, never delete, and never touch a "!" protected path.
          # The engine is a script so that the thing CI runs and the thing
          # scripts/sync-selftest.sh tests are the same file.
          bash scripts/factory-sync.sh "$RUNNER_TEMP/template" "$MANIFEST" --mode=nondestructive

          # A sync must never remove a tracked file. If one ever goes missing,
          # something reintroduced destructive behaviour — stop, do not commit.
          DELETED="$(git diff --name-only --diff-filter=D)"
          if [ -n "$DELETED" ]; then
            echo "::error::factory-update deleted tracked files, which it must never do:"
            echo "$DELETED"
            exit 1
          fi

          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Office already matches the template on every managed path."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain
          fi

      - name: Note unmanaged drift (never applied, only reported)
        id: drift
        if: steps.version.outputs.proceed == 'true'
        run: |
          set -u
          NOTES=""
          # The manifest itself
          if [ -f .github/template-manifest.txt ] && [ -f "$RUNNER_TEMP/template/.github/template-manifest.txt" ]; then
            if ! diff -q .github/template-manifest.txt "$RUNNER_TEMP/template/.github/template-manifest.txt" >/dev/null; then
              NOTES="$NOTES- Your \`.github/template-manifest.txt\` differs from the template's. If yours was edited on purpose, ignore this; otherwise compare them.\n"
            fi
          fi
          # Workflow files (the Actions token cannot write these by design)
          if [ -d "$RUNNER_TEMP/template/.github/workflows" ]; then
            for wf in "$RUNNER_TEMP/template/.github/workflows"/*; do
              name=$(basename "$wf")
              if [ ! -f ".github/workflows/$name" ] || ! diff -q ".github/workflows/$name" "$wf" >/dev/null; then
                NOTES="$NOTES- The template's workflow \`$name\` differs from (or is missing in) your office. Automation can't rewrite automation — ask a Code seat to bring it over by PR.\n"
              fi
            done
          fi
          # The updater's own executable dependencies.
          #
          # This workflow EXECUTES scripts/factory-sync.sh and
          # scripts/sync-selftest.sh. The updater and the code it runs are ONE
          # subsystem, and there is exactly one way their version paths can
          # come apart without anybody noticing: your manifest does not list
          # scripts/, so the sync never updates them, so a fix made upstream to
          # the sync engine stops at your door — permanently, and in silence,
          # while this workflow keeps running the old copy every month.
          #
          # That silence is the whole defect. This step cannot fix it (the
          # manifest is yours, and only you may change what an update may
          # touch), so it does the next thing: it says so, by name, in the PR.
          MANAGES_SCRIPTS=no
          if [ -f .github/template-manifest.txt ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|'#'*) continue ;; esac
              line="${line%% *}"
              case "$line" in scripts/|scripts/*) MANAGES_SCRIPTS=yes ;; esac
            done < .github/template-manifest.txt
          fi

          SCRIPT_DRIFT=""
          if [ -d "$RUNNER_TEMP/template/scripts" ]; then
            while IFS= read -r -d '' rel; do
              rel="${rel#./}"
              if [ ! -f "scripts/$rel" ] || ! diff -q "scripts/$rel" "$RUNNER_TEMP/template/scripts/$rel" >/dev/null; then
                SCRIPT_DRIFT="$SCRIPT_DRIFT \`scripts/$rel\`"
              fi
            done < <(cd "$RUNNER_TEMP/template/scripts" && find . -type f -print0)
          fi

          if [ "$MANAGES_SCRIPTS" = "no" ]; then
            NOTES="$NOTES- **Your \`.github/template-manifest.txt\` does not list \`scripts/\` — and this workflow runs \`scripts/\`.** Every future fix to the sync engine will land in the template and stop here, silently, while your monthly update keeps running the copy you have now.${SCRIPT_DRIFT:+ Already behind:$SCRIPT_DRIFT.} Add one line — \`scripts/\` — to your manifest, and the engine updates itself from then on. (\`guides/SAFE-UPDATE-BOOTSTRAP.md\` has the order.)\n"
          elif [ -n "$SCRIPT_DRIFT" ]; then
            NOTES="$NOTES- The template's sync engine differs from yours ($SCRIPT_DRIFT) even though your manifest manages \`scripts/\` — so something is holding it back, most likely a \`!\` protect line. Intentional is fine; unintentional means this office runs a stale engine. Worth one look.\n"
          fi

          {
            echo "notes<<EOF"
            printf '%b' "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or refresh the update PR
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -u
          git config user.name "factory-update"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add -A
          git commit -m "factory-update: sync template-managed paths from the template"
          git push -f origin "$UPDATE_BRANCH"

      - name: Create the PR if none is open
        if: steps.apply.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          DRIFT_NOTES: ${{ steps.drift.outputs.notes }}
        with:
          script: |
            const head = process.env.UPDATE_BRANCH;
            const notes = (process.env.DRIFT_NOTES || '').trim();
            const body = [
              'The template this factory was created from has improvements on its',
              'template-managed paths (listed in `.github/template-manifest.txt`).',
              'This PR is the whole delta — nothing outside the manifest is touched,',
              'and nothing merges without you.',
              '',
              'Review it like any other PR: read the diff, ask a seat to explain any',
              'part of it, merge when satisfied — or close it to skip this round',
              '(it will be re-proposed next run while the difference remains).',
              notes ? '\n**Also noticed, not applied:**\n' + notes : '',
            ].join('\n');
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', head: `${context.repo.owner}:${head}`,
            });
            if (prs.data.length > 0) {
              await github.rest.pulls.update({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: prs.data[0].number, body,
              });
              core.info(`Refreshed existing update PR #${prs.data[0].number}`);
            } else {
              const pr = await github.rest.pulls.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: 'Factory update: improvements from the template',
                head, base: context.payload.repository.default_branch, body,
              });
              core.info(`Opened update PR #${pr.data.number}`);
            }
