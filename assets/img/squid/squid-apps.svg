<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="The factory squid holding a phone">
  <title>The Agent on your home screen</title>
  <defs>
    <linearGradient id="p-mantle" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="0.45" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#E0761A"/>
    </linearGradient>
    <linearGradient id="p-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F27C2C"/>
      <stop offset="1" stop-color="#C4611A"/>
    </linearGradient>
    <linearGradient id="p-fin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFA267"/>
      <stop offset="1" stop-color="#F7931A"/>
    </linearGradient>
    <radialGradient id="p-sheen" cx="0.34" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g fill="none" stroke="url(#p-arm)" stroke-linecap="round">
    <path d="M52 76 C46 96 40 112 31 124" stroke-width="7"/>
    <path d="M60 79 C56 100 52 118 47 134" stroke-width="8"/>
    <path d="M68 80 C67 104 66 122 65 140" stroke-width="8.5"/>
    <path d="M77 80 C79 102 81 120 83 138" stroke-width="8.5"/>
  </g>

  <!-- the phone, held by two tentacles that wrap its edges -->
  <g>
    <rect x="92" y="62" width="46" height="82" rx="10" fill="#0A0A0B" stroke="#202A35" stroke-width="2.5"/>
    <rect x="97" y="67" width="36" height="72" rx="6" fill="#18181A"/>
    <rect x="107" y="70" width="16" height="4" rx="2" fill="#000"/>
    <rect x="103" y="82" width="24" height="5" rx="2.5" fill="#232326"/>
    <rect x="103" y="93" width="18" height="5" rx="2.5" fill="#232326"/>
    <rect x="109" y="104" width="18" height="5" rx="2.5" fill="#00D9FF" opacity="0.8"/>
    <rect x="103" y="118" width="24" height="10" rx="5" fill="#00D9FF" opacity="0.9"/>
  </g>
  <g fill="none" stroke="url(#p-arm)" stroke-linecap="round" stroke-width="7.5">
    <path d="M85 78 C96 84 104 94 100 106"/>
    <path d="M88 70 C104 60 122 56 136 62"/>
  </g>

  <path d="M60 22 C47 17 33 23 26 36 C37 41 51 38 60 32 Z" fill="url(#p-fin)"/>
  <path d="M78 22 C91 17 105 23 112 36 C101 41 87 38 78 32 Z" fill="url(#p-fin)"/>

  <path d="M69 12 C80 12 90 30 92 54 C94 74 85 88 69 88 C53 88 44 74 46 54 C48 30 58 12 69 12 Z" fill="url(#p-mantle)"/>
  <path d="M69 12 C80 12 90 30 92 54 C94 74 85 88 69 88 C53 88 44 74 46 54 C48 30 58 12 69 12 Z" fill="url(#p-sheen)"/>

  <circle cx="59" cy="40" r="6.76" fill="#00D9FF" opacity="0.10"/>
    <circle cx="59" cy="40" r="4.42" fill="#00D9FF" opacity="0.20"/>
    <circle cx="59" cy="40" r="2.6" fill="#00D9FF"/>
  <circle cx="77" cy="47" r="5.20" fill="#00D9FF" opacity="0.10"/>
    <circle cx="77" cy="47" r="3.40" fill="#00D9FF" opacity="0.20"/>
    <circle cx="77" cy="47" r="2.0" fill="#00D9FF"/>

  <ellipse cx="58" cy="66" rx="7.6" ry="8.1" fill="#1A0D06"/>
  <ellipse cx="80" cy="66" rx="7.6" ry="8.1" fill="#1A0D06"/>
  <circle cx="60.5" cy="63" r="2.5" fill="#FFFFFF" opacity="0.92"/>
  <circle cx="82.5" cy="63" r="2.5" fill="#FFFFFF" opacity="0.92"/>
